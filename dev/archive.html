<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Архів (dev)</title>
<link rel="stylesheet" href="../extension/archive/archive.css">
<!-- Dev copy of extension/archive/archive.html: same markup and scripts, plus the chrome.* shim and the
     real background router, sharing storage with dev/harness.html (same origin). -->
</head>
<body>
<header class="appbar">
  <div class="brand">
    <img src="../extension/icons/icon-48.png" srcset="../extension/icons/icon-96.png 2x" alt="" width="32" height="32">
    <span>Архів транскриптів</span>
  </div>
  <label class="search">
    <span data-icon="search"></span>
    <input type="search" id="search" placeholder="Пошук у всіх мітингах" autocomplete="off" spellcheck="false">
  </label>
  <button class="icon-btn" id="open-settings" aria-label="Налаштування" title="Налаштування"><span data-icon="settings"></span></button>
</header>
<main class="layout">
  <nav class="sidebar" aria-label="Мітинги"><div id="meeting-list" class="meeting-list"></div></nav>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<div class="snackbar" id="snackbar" role="status" hidden></div>

<script src="chrome-shim.js"></script>
<script src="../extension/shared/icons.js"></script>
<script src="../extension/shared/util.js"></script>
<script src="../extension/shared/strings.js"></script>
<script src="../extension/shared/format.js"></script>
<script type="module">
  window.__downloads = [];
  // Fake Google Drive: sign-in is a flag in the shim storage, uploads are recorded. Set window.__driveFail to
  // an Error (add kind: 'auth' for an expired sign-in) to make uploads fail.
  window.__uploads = [];
  const driveState = async () => (await chrome.storage.local.get('driveAuth')).driveAuth || null;
  window.__mtDriveAuth = {
    configured: () => true,
    status: async () => ({ connected: !!(await driveState())?.refreshToken, email: (await driveState())?.email || null }),
    connect: async () => {
      await chrome.storage.local.set({ driveAuth: { refreshToken: 'dev', email: 'dev@example.com' } });
      return { connected: true, email: 'dev@example.com' };
    },
    disconnect: () => chrome.storage.local.remove('driveAuth'),
  };
  window.__mtRequestDriveAccess = async () => true;
  const { createRouter } = await import('../extension/background/router.js');
  const router = createRouter({
    storage: chrome.storage.local,
    download: async ({ filename, text }) => { window.__downloads.push({ filename, text }); return { filename }; },
    drive: {
      connected: async () => (await window.__mtDriveAuth.status()).connected,
      upload: async (file) => {
        if (window.__driveFail) throw window.__driveFail;
        window.__uploads.push(file);
        return { fileId: file.fileId || `dev-file-${window.__uploads.length}` };
      },
    },
  });
  window.__harnessBackground = (msg, sender) => router.handle(msg, sender);
  await import('../extension/archive/archive.js');
</script>
</body>
</html>
