<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #1b1c1f 0%, #26282c 100%);
    color: #e3e3e3; font-family: "Google Sans", Roboto, -apple-system, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box;
  }
  .head { display: flex; align-items: center; gap: 16px; }
  img { width: 64px; height: 64px; }
  h1 { margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -0.2px; color: #fff; }
  p { margin: 18px 0 0; font-size: 17px; line-height: 24px; color: #c4c7c5; }
  .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; padding: 5px 12px; border-radius: 999px;
    background: #3c2a2a; color: #f2b8b5; font-size: 13px; width: max-content; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f28b82; }
</style>
</head>
<body>
  <div class="head">
    <img src="../extension/icons/icon-128.png" alt="">
    <h1>Meet Transcriber</h1>
  </div>
  <p>Транскрипт українських субтитрів Google Meet з іменами мовців. Усе локально.</p>
  <span class="pill"><span class="dot"></span>Запис</span>
</body>
</html>
